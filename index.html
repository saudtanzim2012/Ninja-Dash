<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Ninja Dash</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b12;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#gameWrapper{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}


/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;
    pointer-events:none;
}

.hudBox{
    min-width:90px;

    padding:9px 13px;

    border-radius:12px;

    background:rgba(0,0,0,.55);

    border:1px solid rgba(255,255,255,.15);

    color:white;

    font-size:15px;
    font-weight:bold;

    text-align:center;

    backdrop-filter:blur(6px);
}

#health{
    color:#ff5252;
}

#coins{
    color:#ffd54f;
}

#distance{
    color:#67d8ff;
}


/* =========================
   START / GAME OVER
========================= */

.screen{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    background:
        radial-gradient(
            circle at center,
            rgba(20,35,60,.75),
            rgba(0,0,0,.92)
        );
}

#gameOverScreen{
    display:none;
}

.gameTitle{
    font-size:clamp(45px,9vw,90px);

    font-weight:900;

    letter-spacing:4px;

    color:white;

    text-shadow:
        0 5px 25px rgba(0,0,0,.8);

    margin-bottom:10px;
}

.gameSubtitle{
    color:#b8c0cc;

    font-size:16px;

    margin-bottom:30px;
}

.mainButton{
    border:none;

    padding:14px 35px;

    border-radius:14px;

    background:#e53935;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 0 #941c1c;

    transition:.15s;
}

.mainButton:hover{
    filter:brightness(1.1);
}

.mainButton:active{
    transform:translateY(5px);

    box-shadow:
        0 1px 0 #941c1c;
}


/* =========================
   PC CONTROLS INFO
========================= */

#pcControls{
    position:absolute;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:10;

    color:rgba(255,255,255,.65);

    font-size:13px;

    background:rgba(0,0,0,.35);

    padding:8px 14px;

    border-radius:10px;

    pointer-events:none;
}


/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{
    position:absolute;

    left:0;
    right:0;
    bottom:20px;

    z-index:15;

    display:none;

    justify-content:space-between;

    align-items:flex-end;

    padding:0 20px;

    pointer-events:none;
}

.controlSide{
    display:flex;

    gap:12px;

    pointer-events:auto;
}

.controlButton{
    width:64px;
    height:64px;

    border-radius:50%;

    border:2px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.55);

    color:white;

    font-size:25px;

    display:flex;

    justify-content:center;
    align-items:center;

    user-select:none;

    touch-action:manipulation;
}

.controlButton:active{
    transform:scale(.92);

    background:
        rgba(255,255,255,.2);
}

#attackButton{
    background:
        rgba(180,30,30,.75);
}


/* =========================
   MOBILE
========================= */

@media (max-width:700px){

    #mobileControls{
        display:flex;
    }

    #pcControls{
        display:none;
    }

    .hudBox{
        min-width:auto;

        padding:8px 10px;

        font-size:13px;
    }

}


/* =========================
   LANDSCAPE PHONE
========================= */

@media (max-height:500px)
       and (orientation:landscape){

    #mobileControls{
        bottom:10px;
    }

    .controlButton{
        width:55px;
        height:55px;
    }

    #hud{
        top:8px;
    }

}

</style>
</head>


<body>

<div id="gameWrapper">

<canvas id="gameCanvas"></canvas>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="hudBox">
        ❤️ <span id="health">3</span>
    </div>

    <div class="hudBox">
        🪙 <span id="coins">0</span>
    </div>

    <div class="hudBox">
        📏 <span id="distance">0</span>m
    </div>

</div>


<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen"
     class="screen">

    <div class="gameTitle">
        🥷 NINJA DASH
    </div>

    <div class="gameSubtitle">
        Run • Jump • Slide • Attack
    </div>

    <button
        class="mainButton"
        onclick="startGame()">

        ▶ START GAME

    </button>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOverScreen"
     class="screen">

    <div class="gameTitle">
        GAME OVER
    </div>

    <div class="gameSubtitle">

        Distance:
        <strong id="finalDistance">0</strong>m

        <br><br>

        Coins:
        <strong id="finalCoins">0</strong>

        <br><br>

        Score:
        <strong id="finalScore">0</strong>

    </div>

    <button
        class="mainButton"
        onclick="restartGame()">

        🔄 PLAY AGAIN

    </button>

</div>


<!-- =========================
     PC CONTROLS
========================= -->

<div id="pcControls">

    ↑ / SPACE = Jump
    &nbsp; • &nbsp;
    ↓ = Slide
    &nbsp; • &nbsp;
    X / ENTER = Attack

</div>


<!-- =========================
     MOBILE CONTROLS
========================= -->

<div id="mobileControls">

    <div class="controlSide">

        <button
            class="controlButton"
            id="jumpButton">

            ⬆️

        </button>

        <button
            class="controlButton"
            id="slideButton">

            ⬇️

        </button>

    </div>


    <div class="controlSide">

        <button
            class="controlButton"
            id="attackButton">

            ⚔️

        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


let W = 0;
let H = 0;


function resizeCanvas(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

    updateGround();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   GAME VARIABLES
========================================================= */

let gameRunning = false;

let score = 0;

let coins = 0;

let distance = 0;

let health = 3;

let gameSpeed = 5;

let lastTime = 0;


/* =========================================================
   GROUND
========================================================= */

let groundY = 0;


function updateGround(){

    groundY =
        H -
        Math.max(
            110,
            H * .22
        );

}


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:120,

    y:0,

    width:48,

    height:68,

    velocityY:0,

    gravity:.8,

    jumpPower:-15,

    grounded:true,

    sliding:false,

    attacking:false,

    attackTimer:0

};


/* =========================================================
   OBJECT ARRAYS
========================================================= */

let obstacles = [];

let enemies = [];

let coinObjects = [];


/* =========================================================
   TIMERS
========================================================= */

let obstacleTimer = 0;

let enemyTimer = 0;

let coinTimer = 0;


/* =========================================================
   INPUT FUNCTIONS
========================================================= */

function jump(){

    if(!gameRunning)
        return;

    if(player.grounded){

        player.velocityY =
            player.jumpPower;

        player.grounded =
            false;

    }

}


function slide(){

    if(!gameRunning)
        return;

    if(player.sliding)
        return;

    player.sliding = true;

    setTimeout(
        function(){

            player.sliding = false;

        },
        500
    );

}


function attack(){

    if(!gameRunning)
        return;

    player.attacking = true;

    player.attackTimer = 14;

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();

        }


        if(
            e.code === "ArrowDown"
        ){

            e.preventDefault();

            slide();

        }


        if(
            e.code === "KeyX" ||
            e.code === "Enter"
        ){

            e.preventDefault();

            attack();

        }

    }
);


/* =========================================================
   MOBILE BUTTONS
========================================================= */

document
    .getElementById("jumpButton")
    .addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            jump();

        }
    );


document
    .getElementById("slideButton")
    .addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            slide();

        }
    );


document
    .getElementById("attackButton")
    .addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            attack();

        }
    );


/* =========================================================
   START
========================================================= */

function startGame(){

    document
        .getElementById("startScreen")
        .style.display =
        "none";

    document
        .getElementById("gameOverScreen")
        .style.display =
        "none";


    resetGame();

    gameRunning = true;

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

    score = 0;

    coins = 0;

    distance = 0;

    health = 3;

    gameSpeed = 5;

    obstacles = [];

    enemies = [];

    coinObjects = [];

    obstacleTimer = 50;

    enemyTimer = 120;

    coinTimer = 70;


    player.x = 120;

    player.y =
        groundY -
        player.height;

    player.velocityY = 0;

    player.grounded = true;

    player.sliding = false;

    player.attacking = false;

    player.attackTimer = 0;


    updateHUD();

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    startGame();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    if(!gameRunning)
        return;


    const delta =
        Math.min(
            (time - lastTime) /
            16.67,
            2
        );


    lastTime = time;


    update(delta);

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(delta){

    updateGround();


    /* PLAYER */

    player.velocityY +=
        player.gravity *
        delta;


    player.y +=
        player.velocityY *
        delta;


    const currentHeight =
        player.sliding
            ? player.height * .55
            : player.height;


    if(
        player.y +
        currentHeight >=
        groundY
    ){

        player.y =
            groundY -
            currentHeight;

        player.velocityY = 0;

        player.grounded = true;

    }
    else{

        player.grounded = false;

    }


    /* ATTACK */

    if(
        player.attackTimer > 0
    ){

        player.attackTimer -=
            delta;

    }
    else{

        player.attacking = false;

    }


    /* SPEED */

    gameSpeed +=
        .0015 *
        delta;


    distance +=
        gameSpeed *
        .08 *
        delta;


    score =
        Math.floor(
            distance * 10
        );


    /* SPAWN TIMERS */

    obstacleTimer -= delta;

    enemyTimer -= delta;

    coinTimer -= delta;


    if(
        obstacleTimer <= 0
    ){

        spawnObstacle();

        obstacleTimer =
            80 +
            Math.random() *
            100;

    }


    if(
        enemyTimer <= 0
    ){

        spawnEnemy();

        enemyTimer =
            140 +
            Math.random() *
            160;

    }


    if(
        coinTimer <= 0
    ){

        spawnCoins();

        coinTimer =
            100 +
            Math.random() *
            120;

    }


    /* MOVE */

    obstacles.forEach(
        function(o){

            o.x -=
                gameSpeed *
                delta;

        }
    );


    enemies.forEach(
        function(e){

            e.x -=
                gameSpeed *
                delta;

        }
    );


    coinObjects.forEach(
        function(c){

            c.x -=
                gameSpeed *
                delta;

            c.rotation +=
                .08 *
                delta;

        }
    );


    /* COLLISIONS */

    checkObstacleCollisions();

    checkEnemyCollisions();

    checkCoinCollisions();


    /* REMOVE */

    obstacles =
        obstacles.filter(
            o =>
                o.x +
                o.width >
                -80
        );


    enemies =
        enemies.filter(
            e =>
                e.x +
                e.width >
                -80
        );


    coinObjects =
        coinObjects.filter(
            c =>
                c.x >
                -50
        );


    updateHUD();

}


/* =========================================================
   SPAWN OBSTACLE
========================================================= */

function spawnObstacle(){

    const type =
        Math.random() <
        .5
            ? "spike"
            : "barrier";


    if(type === "spike"){

        obstacles.push({

            x:W + 50,

            y:groundY - 35,

            width:40,

            height:35,

            type:"spike",

            hit:false

        });

    }
    else{

        obstacles.push({

            x:W + 50,

            y:groundY - 55,

            width:65,

            height:55,

            type:"barrier",

            hit:false

        });

    }

}


/* =========================================================
   SPAWN ENEMY
========================================================= */

function spawnEnemy(){

    enemies.push({

        x:W + 100,

        y:groundY - 60,

        width:45,

        height:60,

        alive:true

    });

}


/* =========================================================
   SPAWN COINS
========================================================= */

function spawnCoins(){

    const startX =
        W + 80;


    const baseY =
        groundY -
        100 -
        Math.random() *
        100;


    for(
        let i=0;
        i<5;
        i++
    ){

        coinObjects.push({

            x:
                startX +
                i * 45,

            y:baseY,

            radius:10,

            rotation:0,

            collected:false

        });

    }

}


/* =========================================================
   PLAYER RECT
========================================================= */

function getPlayerRect(){

    const h =
        player.sliding
            ? player.height * .55
            : player.height;


    return {

        x:player.x,

        y:player.y,

        width:player.width,

        height:h

    };

}


/* =========================================================
   RECT COLLISION
========================================================= */

function rectCollision(a,b){

    return (

        a.x <
        b.x + b.width &&

        a.x + a.width >
        b.x &&

        a.y <
        b.y + b.height &&

        a.y + a.height >
        b.y

    );

}


/* =========================================================
   OBSTACLES
========================================================= */

function checkObstacleCollisions(){

    const p =
        getPlayerRect();


    obstacles.forEach(
        function(o){

            if(o.hit)
                return;


            if(
                rectCollision(
                    p,
                    o
                )
            ){

                o.hit = true;

                damagePlayer();

            }

        }
    );

}


/* =========================================================
   ENEMIES
========================================================= */

function checkEnemyCollisions(){

    const p =
        getPlayerRect();


    enemies.forEach(
        function(e){

            if(!e.alive)
                return;


            if(
                rectCollision(
                    p,
                    e
                )
            ){

                if(
                    player.attacking
                ){

                    e.alive = false;

                    score += 100;

                }
                else{

                    e.alive = false;

                    damagePlayer();

                }

            }

        }
    );

}


/* =========================================================
   COINS
========================================================= */

function checkCoinCollisions(){

    const p =
        getPlayerRect();


    coinObjects.forEach(
        function(c){

            const closestX =
                Math.max(
                    p.x,
                    Math.min(
                        c.x,
                        p.x +
                        p.width
                    )
                );


            const closestY =
                Math.max(
                    p.y,
                    Math.min(
                        c.y,
                        p.y +
                        p.height
                    )
                );


            const dx =
                c.x -
                closestX;


            const dy =
                c.y -
                closestY;


            if(
                dx * dx +
                dy * dy <
                c.radius *
                c.radius
            ){

                c.collected =
                    true;

                coins++;

                score += 50;

            }

        }
    );


    coinObjects =
        coinObjects.filter(
            c =>
                !c.collected
        );

}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(){

    health--;

    if(health <= 0){

        gameOver();

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    gameRunning = false;


    document
        .getElementById(
            "finalDistance"
        )
        .textContent =
        Math.floor(distance);


    document
        .getElementById(
            "finalCoins"
        )
        .textContent =
        coins;


    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        score;


    document
        .getElementById(
            "gameOverScreen"
        )
        .style.display =
        "flex";

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
        .getElementById("health")
        .textContent =
        health;


    document
        .getElementById("coins")
        .textContent =
        coins;


    document
        .getElementById("distance")
        .textContent =
        Math.floor(distance);

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();

    drawGround();

    drawCoins();

    drawObstacles();

    drawEnemies();

    drawPlayer();

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            groundY
        );


    sky.addColorStop(
        0,
        "#10182c"
    );


    sky.addColorStop(
        1,
        "#49677a"
    );


    ctx.fillStyle = sky;


    ctx.fillRect(
        0,
        0,
        W,
        groundY
    );


    /* MOON */

    ctx.fillStyle =
        "#fff2bd";


    ctx.beginPath();


    ctx.arc(
        W - 100,
        100,
        35,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* MOUNTAINS */

    ctx.fillStyle =
        "#172235";


    ctx.beginPath();


    ctx.moveTo(
        0,
        groundY
    );


    for(
        let x=0;
        x<=W+200;
        x+=160
    ){

        ctx.lineTo(
            x,
            groundY -
            100 -
            Math.sin(
                x * .01
            ) * 80
        );

    }


    ctx.lineTo(
        W,
        groundY
    );


    ctx.closePath();

    ctx.fill();


    /* TREES */

    for(
        let x=40;
        x<W;
        x+=180
    ){

        drawTree(
            x,
            groundY
        );

    }

}


/* =========================================================
   TREE
========================================================= */

function drawTree(x,y){

    ctx.fillStyle =
        "#432d1f";


    ctx.fillRect(
        x - 8,
        y - 80,
        16,
        80
    );


    ctx.fillStyle =
        "#173c27";


    ctx.beginPath();


    ctx.arc(
        x,
        y - 90,
        35,
        0,
        Math.PI * 2
    );


    ctx.fill();

}


/* =========================================================
   GROUND
========================================================= */

function drawGround(){

    ctx.fillStyle =
        "#182018";


    ctx.fillRect(
        0,
        groundY,
        W,
        H-groundY
    );


    ctx.fillStyle =
        "#30452d";


    ctx.fillRect(
        0,
        groundY,
        W,
        8
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.08)";


    ctx.lineWidth = 2;


    for(
        let x =
            -(distance * 3 % 80);
        x<W;
        x+=80
    ){

        ctx.beginPath();


        ctx.moveTo(
            x,
            groundY + 30
        );


        ctx.lineTo(
            x + 40,
            groundY + 30
        );


        ctx.stroke();

    }

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const p =
        getPlayerRect();


    /* SHADOW */

    ctx.fillStyle =
        "rgba(0,0,0,.3)";


    ctx.beginPath();


    ctx.ellipse(
        player.x + 24,
        groundY + 5,
        30,
        8,
        0,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* BODY */

    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        p.x + 10,
        p.y + 20,
        28,
        p.height - 20
    );


    /* HEAD */

    ctx.fillStyle =
        "#252525";


    ctx.beginPath();


    ctx.arc(
        p.x + 24,
        p.y + 15,
        16,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* HEADBAND */

    ctx.fillStyle =
        "#d62828";


    ctx.fillRect(
        p.x + 8,
        p.y + 8,
        32,
        5
    );


    /* EYES */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        p.x + 16,
        p.y + 15,
        5,
        3
    );


    ctx.fillRect(
        p.x + 27,
        p.y + 15,
        5,
        3
    );


    /* LEGS */

    ctx.strokeStyle =
        "#111";


    ctx.lineWidth = 7;


    ctx.beginPath();


    ctx.moveTo(
        p.x + 18,
        p.y + p.height
    );


    ctx.lineTo(
        p.x + 10,
        p.y + p.height + 8
    );


    ctx.moveTo(
        p.x + 32,
        p.y + p.height
    );


    ctx.lineTo(
        p.x + 40,
        p.y + p.height + 8
    );


    ctx.stroke();


    /* SWORD */

    ctx.strokeStyle =
        "#eeeeee";


    ctx.lineWidth = 4;


    ctx.beginPath();


    if(player.attacking){

        ctx.moveTo(
            p.x + 35,
            p.y + 30
        );


        ctx.lineTo(
            p.x + 78,
            p.y + 4
        );

    }
    else{

        ctx.moveTo(
            p.x + 38,
            p.y + 30
        );


        ctx.lineTo(
            p.x + 55,
            p.y + 55
        );

    }


    ctx.stroke();

}


/* =========================================================
   COINS
========================================================= */

function drawCoins(){

    coinObjects.forEach(
        function(c){

            ctx.save();


            ctx.translate(
                c.x,
                c.y
            );


            ctx.scale(
                Math.max(
                    .2,
                    Math.abs(
                        Math.cos(
                            c.rotation
                        )
                    )
                ),
                1
            );


            ctx.fillStyle =
                "#ffd54f";


            ctx.beginPath();


            ctx.arc(
                0,
                0,
                c.radius,
                0,
                Math.PI * 2
            );


            ctx.fill();


            ctx.restore();

        }
    );

}


/* =========================================================
   OBSTACLES
========================================================= */

function drawObstacles(){

    obstacles.forEach(
        function(o){

            if(
                o.type ===
                "spike"
            ){

                ctx.fillStyle =
                    "#aaaaaa";


                ctx.beginPath();


                ctx.moveTo(
                    o.x,
                    groundY
                );


                ctx.lineTo(
                    o.x +
                    o.width / 2,
                    o.y
                );


                ctx.lineTo(
                    o.x +
                    o.width,
                    groundY
                );


                ctx.closePath();


                ctx.fill();

            }
            else{

                ctx.fillStyle =
                    "#684b32";


                ctx.fillRect(
                    o.x,
                    o.y,
                    o.width,
                    o.height
                );


                ctx.fillStyle =
                    "#936a43";


                ctx.fillRect(
                    o.x + 8,
                    o.y + 8,
                    o.width - 16,
                    8
                );

            }

        }
    );

}


/* =========================================================
   ENEMIES
========================================================= */

function drawEnemies(){

    enemies.forEach(
        function(e){

            if(!e.alive)
                return;


            /* BODY */

            ctx.fillStyle =
                "#3b0d0d";


            ctx.fillRect(
                e.x + 8,
                e.y + 18,
                30,
                42
            );


            /* HEAD */

            ctx.fillStyle =
                "#651515";


            ctx.beginPath();


            ctx.arc(
                e.x + 22,
                e.y + 15,
                15,
                0,
                Math.PI * 2
            );


            ctx.fill();


            /* EYES */

            ctx.fillStyle =
                "#ff4444";


            ctx.fillRect(
                e.x + 14,
                e.y + 13,
                5,
                4
            );


            ctx.fillRect(
                e.x + 25,
                e.y + 13,
                5,
                4
            );

        }
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

resizeCanvas();

player.y =
    groundY -
    player.height;

draw();

</script>
